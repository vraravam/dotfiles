# file location: ${XDG_CONFIG_HOME}/starship.toml
#
# Starship prompt configuration optimized for performance and simplicity.
#
# Left prompt:  os_icon -> dir -> git (branch + status symbols) -> prompt char
# Right prompt: status -> cmd_duration (≥3s) -> jobs -> username@hostname (SSH/root only) -> time
#
# Design philosophy:
#   - Use built-in modules over custom segments (10-100x faster, automatic caching)
#   - Let git_status provide dirty indicator (yellow symbols when changes exist)
#   - Keep git_branch always green (consistent visual anchor)
#   - Eliminate subprocess overhead (no custom when conditions or shell commands)
#
# Colors:
#   os_icon:   bg=white,  fg=#000000 (explicit black to avoid terminal remapping)
#   directory: bg=blue,   fg=#e4e4e4 (repo root anchor in bright-white bold)
#   git_branch: bg=green, fg=black   (always green - clean visual anchor)
#   git_status: bg=yellow, fg=black  (only shown when dirty - yellow symbols indicate changes)
#   status:    ✔ bold green / ✘ bold red (no background, right prompt)
#   cmd_dur:   bg=cyan,   fg=black  (only shown when command took ≥ 3 seconds)
#   time:      bg=white,  fg=black
#   context:   fg=yellow, no bg     (SSH/root only)
#
# Powerline separators (requires Nerd Font / MesloLGS NF):
#   \uE0B0  — right-pointing filled arrow (left prompt segment separator)
#   \uE0B2  — left-pointing filled arrow (right prompt segment separator)
#   \uE0B3  — left-pointing thin arrow (right prompt sub-separator)
# Branch icon: \uF126

# Disable blank line before prompt - iTerm2's auto-detection places mark on blank line instead of prompt
add_newline = false
# Command timeout for git operations in larger repos
command_timeout = 1000

# ── Left prompt ───────────────────────────────────────────────────────────────
# Segment order: iterm2_mark -> os -> directory -> git_branch -> git_size -> git_status -> git_state -> iterm2_end -> character
# Arrow separators transition: white -> blue -> green -> (yellow if dirty) -> terminal default
#
# Design:
# - git_branch: Always green (visual anchor)
# - git_size: Shows repo size on green background
# - git_status: Yellow symbols when dirty/ahead/behind; a plain green arrow when the
#   branch has an upstream and is not ahead/behind (see [git_status]'s 'up_to_date'
#   field below -- this used to be a separate custom.git_sync_status segment that
#   forked 'git status' + awk; it's now computed natively by git_status itself via
#   gitoxide, with zero subprocess forks, at the cost of a minor semantic change:
#   the arrow can now appear alongside dirty symbols too, see comment on [git_status])
#
# Visual behavior:
# - Clean & synced: green branch -> size -> green arrow -> terminal bg
# - Dirty & synced: green branch -> size -> yellow symbols (!?+*) -> yellow arrow -> green arrow
# - Clean but ahead/behind: green branch -> size -> yellow symbols (⇡/⇣) -> yellow arrow
# - Dirty & ahead/behind: green branch -> size -> yellow symbols -> yellow arrow -> yellow ahead/behind -> yellow arrow
#
# Performance: Built-in Rust modules (zero forks, gitoxide-based) + 1 custom segment
# for repo size (~25-30ms, see [custom.git_size] below). Modules render in parallel
# (starship's async scheduler), so this does not add to total prompt latency serially.
#
# iTerm2 shell integration: mark A (prompt start) + mark B (prompt end) output by starship.
# Newline output in precmd hook (runs before starship).
format = """
${custom.iterm2_start}\
[$os](bg:white fg:black)\
[\uE0B0](fg:white bg:blue)\
[$directory](bg:blue fg:#e4e4e4)\
$git_branch\
${custom.git_size}\
$git_status\
$git_state\
${custom.iterm2_end}\
$character"""

# ── Right prompt ──────────────────────────────────────────────────────────────
# Segment order: status -> cmd_duration -> jobs -> context -> time
# cmd_duration has its own embedded \uE0B2 separator (only appears when visible)
# time is always shown, preceded by a \uE0B2 separator (white arrow into white bg)
right_format = """
$status\
$cmd_duration\
$jobs\
$username$hostname\
[\uE0B2](fg:white bg:black)\
$time"""

# Palette - named aliases used by some segments below (not all segments use these;
# some hardcode colors directly where palette references don't resolve in style strings)
palette = "rainbow"

[palettes.rainbow]
color_os        = "white"
color_os_fg     = "black"
color_dir       = "blue"
color_dir_fg    = "color254"   # resolves to #e4e4e4
color_git       = "green"
color_git_fg    = "black"
color_git_dirty = "yellow"     # used by dirty-state git segment (modified/staged/untracked/stashed)
color_status_fg = "green"
color_jobs_fg   = "cyan"
color_ctx_fg    = "yellow"
color254        = "#e4e4e4"

# ── OS icon ───────────────────────────────────────────────────────────────────
# White background, explicit #000000 foreground (avoids terminal bold/dim remapping
# that can make the named "black" color appear washed out)
[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:white fg:#000000"

[os.symbols]
Macos = "\uF179"   # nerd font apple icon

# ── Directory ─────────────────────────────────────────────────────────────────
# Full path from ~ with no truncation (truncation_length=100 is effectively unlimited).
# Repo root segment is highlighted in bright-white bold (anchor styling).
# All path components share the blue background via repo_root_format.
[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bg:color_dir fg:color_dir_fg bold"
read_only = " ⭐"
read_only_style = "bg:color_dir fg:color_dir_fg"
truncation_length = 100
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"
# repo_root_format removed because when the repo root coincides with the home
# directory (e.g. bare dotfiles repo at ~/.git), $before_root_path incorrectly
# includes the path after the repo root, producing duplicate directory output:
# e.g. "~/dev/oss/dev/oss" instead of "~/dev/oss".
# The regular format handles all cases correctly without duplication.

# ── Git branch & status ───────────────────────────────────────────────────────
# Design philosophy (following GitHub issue #7556 comment):
# - git_branch: Always green background (consistent visual anchor)
# - git_status: Yellow background with symbols when dirty/ahead/behind; a plain green
#   arrow (no background) when there's an upstream with no ahead/behind -- see the
#   detailed trade-off comment on [git_status] below.
# - Built-in Rust modules: 10-100x faster than custom shell segments, zero subprocess
#   forks (gitoxide-based, not the 'git' executable -- see 'use_git_executable' in
#   starship's git_status docs, which defaults to false)
# - No custom when conditions: Zero subprocess overhead
#
# Visual behavior:
# - Clean repo, synced: green branch -> green arrow -> terminal bg
# - Dirty repo, synced: green branch -> green->yellow arrow -> yellow status symbols -> yellow arrow -> green arrow
# - Clean repo, ahead/behind: green branch -> green->yellow arrow -> yellow ahead/behind -> yellow arrow
#
# See: https://github.com/starship/starship/issues/7556#issuecomment-5397167112

[git_branch]
disabled = false
# Always show branch with green background (no conditional styling)
# Trailing space on green background for smooth transition to git_size
format = "[\uE0B0](fg:blue bg:green)[ \uf126 $branch ](bg:green fg:black)"
style = "bg:green fg:black"
symbol = ""
truncation_length = 32
truncation_symbol = "…"

[git_status]
disabled = false
# $all_status (dirty file changes) and $ahead_behind (ahead/behind/diverged/synced vs
# upstream) are split into two independently-conditional pieces rather than one shared
# bracket -- this lets $ahead_behind's 'up_to_date' branch render unconditionally
# (a plain green arrow, no yellow) while $all_status stays conditional on actual dirty
# state. Trade-off vs the old design (a separate custom.git_sync_status segment that
# forked 'git status --porcelain=v2' + awk): this whole indicator is now 100% native
# (gitoxide, zero forks) instead of ~3 forks per prompt render, but the green arrow is
# no longer mutually exclusive with dirty symbols -- it now shows whenever there's an
# upstream with no ahead/behind, REGARDLESS of whether the tree is dirty (e.g. a
# modified-but-unpushed-nothing state renders '!1' followed by a green arrow). In the
# rare case of BOTH dirty AND ahead/behind at once, this renders as two separate yellow
# pills (e.g. '!1' then '⇡1') instead of one merged pill ('!1⇡1') -- each half keeps its
# own entry/exit powerline arrows since the format string can't know at render time
# whether the other half will also be visible.
format = "([\uE0B0](fg:green bg:yellow)[ $all_status ](bg:yellow fg:black)[\uE0B0](fg:yellow))$ahead_behind"
style = "bg:yellow fg:black"
# Status symbols with counts
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
stashed = "*${count}"
deleted = "✘${count}"
renamed = "»${count}"
conflicted = "=${count}"
# Ahead/behind symbols -- each carries its own full yellow pill (entry arrow, content,
# exit arrow) since it's no longer sharing a bracket with $all_status (see comment above).
ahead = "[\uE0B0](fg:green bg:yellow)[ ⇡${count} ](bg:yellow fg:black)[\uE0B0](fg:yellow)"
behind = "[\uE0B0](fg:green bg:yellow)[ ⇣${count} ](bg:yellow fg:black)[\uE0B0](fg:yellow)"
diverged = "[\uE0B0](fg:green bg:yellow)[ ⇣${ahead_count}⇡${behind_count} ](bg:yellow fg:black)[\uE0B0](fg:yellow)"
# Plain green arrow (no background) when there's an upstream and no ahead/behind --
# matches the old custom.git_sync_status segment's exact look ('[\uE0B0](fg:green)').
# Empty (default) when there's no upstream configured at all, matching prior behavior.
up_to_date = "[\uE0B0](fg:green)"

# ── Custom: Git repository size ──────────────────────────────────────────────
# Shows pack size in human-readable format (e.g., "1.37 MiB").
# Calls 'git count-objects -vH' + awk directly instead of 'git size' (~30ms vs
# ~10ms measured via 'starship timings'). Going through the alias forks an extra
# process to resolve/execute the '!f() {...}; f' shell function on top of the
# count-objects + awk forks the alias itself needs -- calling count-objects
# directly here skips that redundant fork entirely. The 'git size' alias itself
# remains available for interactive/manual use (see git-config.md, "git size"
# section) and for scripts (path_utils.rb) where the extra fork is negligible.
#
# Visual integration:
# - Placed after git_branch on green background
# - No trailing arrow (git_status provides the transition: either its own yellow
#   entry arrow when dirty, or up_to_date's plain green arrow when clean and synced)
[custom.git_size]
command = "git count-objects -vH | awk '/size-pack:/ {print $2, $3}'"
require_repo = true
when = "true"
shell = ["sh", "--noprofile", "--norc"]
format = "[$output ](bg:green fg:black)"
ignore_timeout = true

# ── Custom: iTerm2 shell integration marks A and B ──────────────────────────
# Mark A (prompt start) and mark B (prompt end) for iTerm2 shell integration.
# Newline output in precmd hook (runs before starship renders).
# Marks C/D (command start/end) output in preexec/precmd hooks in .zshrc.
#
# The complete set of 4 marks enables full iTerm2 features:
#   - Command output selection (⌘⇧A)
#   - Mark navigation/cycling (⌘↑ / ⌘↓ with wraparound)
#   - Shell integration features without iTerm2's auto-detection
#
# Performance: Inline escape sequences (no function call overhead)
# Conditional on ITERM_SESSION_ID (only in iTerm2) and PROMPT_INITIALIZED (after .zshrc loads).
[custom.iterm2_start]
command = 'printf "\033]133;A\007"'
when = 'test -n "${ITERM_SESSION_ID:-}" && test -n "${PROMPT_INITIALIZED:-}"'
shell = ["sh", "--noprofile", "--norc"]
format = "$output"

[custom.iterm2_end]
command = 'printf "\033]133;B\007"'
when = 'test -n "${ITERM_SESSION_ID:-}" && test -n "${PROMPT_INITIALIZED:-}"'
shell = ["sh", "--noprofile", "--norc"]
format = "$output"
description = "iTerm2 prompt end mark (after visible prompt content)"

# ── Exit status ───────────────────────────────────────────────────────────────
# ✔ in bold green on zero exit; ✘ in bold red on non-zero exit.
# success_symbol embeds its own color tag so it overrides the module-level style.
[status]
disabled = false
format = "[$symbol]($style) "
style = "bold red"
success_symbol = "[✔](bold green)"
symbol = "✘"
not_executable_symbol = "✘"
not_found_symbol = "✘"
sigint_symbol = "✘"
signal_symbol = "✘"
map_symbol = true

# ── Command duration ──────────────────────────────────────────────────────────
# Only shown when the last command took ≥ 3 seconds.
# Separator \uE0B2 is embedded so the arrow only appears when this segment is visible.
# \uE0B3 is the thin right-arrow used as a sub-separator after the duration text.
[cmd_duration]
min_time = 3_000
format = "[\uE0B2](fg:cyan bg:black)[ took $duration ](fg:black bg:cyan)[\uE0B3](fg:black bg:cyan)"
show_milliseconds = false

# ── Background jobs ───────────────────────────────────────────────────────────
# Shows ⚙ when there is at least one background job.
[jobs]
format = "[$symbol](fg:color_jobs_fg) "
symbol = "⚙"
number_threshold = 1
symbol_threshold = 1

# ── Direnv ────────────────────────────────────────────────────────────────────
# Disabled: ~/.envrc exists so DIRENV_DIR is always set, making the segment
# permanently visible which is not useful.
[env_var.DIRENV_DIR]
disabled = true

# ── Username/hostname (context) ───────────────────────────────────────────────
# Only shown when in an SSH session or running as root (show_always = false).
# (hidden by default).
[username]
format = "[$user](fg:color_ctx_fg)"
style_user = "fg:color_ctx_fg"
style_root = "fg:red bold"
show_always = false

[hostname]
format = "[@$hostname ](fg:color_ctx_fg)"
style = "fg:color_ctx_fg"
ssh_only = true

# ── Time ──────────────────────────────────────────────────────────────────────
# 12-hour clock, format "%I:%M:%S %p" (e.g. 11:30:00 AM).
# White background, black text. Always shown on the right prompt.
[time]
disabled = false
format = "[ $time ](fg:black bg:white)"
time_format = "%I:%M:%S %p"
use_12hr = true

# ── Prompt character ──────────────────────────────────────────────────────────
# ❯ in green on success, red on error. ❮ in vi command mode.
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# ── Git operation state (built-in module) ────────────────────────────────────
# Shown in bold red when a multi-step git operation is in progress:
# rebase, merge, cherry-pick, revert, or bisect.
[git_state]
format = "[$state( $progress_current/$progress_total)]($style)"
style = "bold red"
rebase = ">> REBASING <<"
merge = ">> MERGING <<"
cherry_pick = ">> CHERRY-PICKING <<"
revert = ">> REVERTING <<"
bisect = ">> BISECTING <<"

# ── Disabled modules ─────────────────────────────────────────────────────────
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[terraform]
disabled = true
[kubernetes]
disabled = true
[python]
disabled = true
[nodejs]
disabled = true
[ruby]
disabled = true
[golang]
disabled = true
[rust]
disabled = true
[java]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true

# ── Enabled lightweight modules ──────────────────────────────────────────────
# mise: shown only when a project has an active mise runtime (auto-detected by
# .mise.toml, .tool-versions, etc.). Quiet by default - only renders when used.
[mise]
disabled = false
format = "[ ⇪ $health ]($style)"
style = "fg:cyan"

# direnv: shown when an .envrc is loaded for the current directory. Useful as
# a visual confirmation that direnv has applied its env vars.
[direnv]
disabled = false
format = "[ direnv $loaded$allowed]($style) "
style = "fg:yellow"
symbol = "📁 "
allowed_msg = ""
not_allowed_msg = "[!]"
denied_msg = "[✗]"
loaded_msg = ""
unloaded_msg = "[?]"
