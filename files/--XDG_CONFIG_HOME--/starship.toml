# file location: ${XDG_CONFIG_HOME}/starship.toml
#
# Starship prompt configuration mirroring the previous powerlevel10k rainbow setup.
#
# Left prompt:  os_icon → dir → git (branch + status symbols + repo size) → prompt char
# Right prompt: status → cmd_duration (≥3s) → jobs → username@hostname (SSH/root only) → time
#
# Colors:
#   os_icon:   bg=white,  fg=#000000 (explicit black to avoid terminal remapping)
#   directory: bg=blue,   fg=#e4e4e4 (repo root anchor in bright-white bold)
#   git clean: bg=green,  fg=black
#   git dirty: bg=yellow, fg=black  (any modified/staged/untracked/stashed files)
#   status:    ✔ bold green / ✘ bold red (no background, right prompt)
#   cmd_dur:   bg=cyan,   fg=black  (only shown when command took ≥ 3 seconds)
#   time:      bg=white,  fg=black
#   context:   fg=yellow, no bg     (SSH/root only)
#
# Powerline separators (requires Nerd Font / MesloLGS NF):
#   \uE0B0  — right-pointing filled arrow (left prompt segment separator)
#   \uE0B2  — left-pointing filled arrow (right prompt segment separator)
#   \uE0B3  — left-pointing thin arrow (right prompt sub-separator)
# Branch icon: \uF126

# Disable blank line before prompt - iTerm2's auto-detection places mark on blank line instead of prompt
# Testing: no blank line to see if mark appears on prompt line
add_newline = false
# Command timeout increased to 1000ms to allow git operations in larger repos
# Custom git modules (git_size, git_clean_arrow) have ignore_timeout=true
command_timeout = 1000

# ── Left prompt ───────────────────────────────────────────────────────────────
# Segment order: iterm2_mark → os → directory → git branch → git size → git status (if dirty/ahead/behind) → clean arrow (if clean) → git state → iterm2_end → character
# Arrow separators transition: white→blue→green→(yellow if dirty/ahead/behind)→terminal default
#
# REWRITTEN to use built-in git modules (Rust implementation, 10-100x faster than shell):
#   git_branch - shows branch with green background (no trailing arrow)
#   custom.git_size - shows repo size on green background with trailing space (no arrow)
#   git_status - shows status symbols with yellow background (ONLY when dirty/ahead/behind, adds green→yellow arrow)
#   custom.git_clean_arrow - shows green arrow (ONLY when completely clean: no changes AND not ahead/behind)
#
# Visual flow:
#   Clean repo: branch → size (trailing space on green) → green arrow
#   Dirty/ahead/behind: branch → size (trailing space on green) → green→yellow arrow → status → yellow arrow
#
# Performance: git_size adds ~50ms, git_clean_arrow adds ~50-180ms (3 git commands: is-dirty + rev-parse + rev-list)
# Trade-off: Shell commands for size display and clean detection vs instant prompt with no size info
#
# iTerm2 shell integration: mark A (prompt start) + mark B (prompt end) output by starship.
# Newline output in precmd hook (runs before starship).
format = """
${custom.iterm2_start}\
[$os](bg:white fg:black)\
[\uE0B0](fg:white bg:blue)\
[$directory](bg:blue fg:#e4e4e4)\
$git_branch\
${custom.git_size}\
$git_status\
${custom.git_clean_arrow}\
$git_state\
${custom.iterm2_end}\
$character"""

# ── Right prompt ──────────────────────────────────────────────────────────────
# Segment order: status → cmd_duration → jobs → context → time
# cmd_duration has its own embedded \uE0B2 separator (only appears when visible)
# time is always shown, preceded by a \uE0B2 separator (white arrow into white bg)
right_format = """
$status\
$cmd_duration\
$jobs\
$username$hostname\
[\uE0B2](fg:white bg:black)\
$time"""

# Palette - named aliases used by some segments below (not all segments use these;
# some hardcode colors directly where palette references don't resolve in style strings)
palette = "rainbow"

[palettes.rainbow]
color_os        = "white"
color_os_fg     = "black"
color_dir       = "blue"
color_dir_fg    = "color254"   # resolves to #e4e4e4
color_git       = "green"
color_git_fg    = "black"
color_git_dirty = "yellow"     # used by dirty-state git segment (modified/staged/untracked/stashed)
color_status_fg = "green"
color_jobs_fg   = "cyan"
color_ctx_fg    = "yellow"
color254        = "#e4e4e4"

# ── OS icon ───────────────────────────────────────────────────────────────────
# White background, explicit #000000 foreground (avoids terminal bold/dim remapping
# that can make the named "black" color appear washed out)
[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:white fg:#000000"

[os.symbols]
Macos = "\uF179"   # nerd font apple icon

# ── Directory ─────────────────────────────────────────────────────────────────
# Full path from ~ with no truncation (truncation_length=100 is effectively unlimited).
# Repo root segment is highlighted in bright-white bold (anchor styling).
# All path components share the blue background via repo_root_format.
[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bg:color_dir fg:color_dir_fg bold"
read_only = " ⭐"
read_only_style = "bg:color_dir fg:color_dir_fg"
truncation_length = 100
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"
# repo_root_format removed because when the repo root coincides with the home
# directory (e.g. bare dotfiles repo at ~/.git), $before_root_path incorrectly
# includes the path after the repo root, producing duplicate directory output:
# e.g. "~/dev/oss/dev/oss" instead of "~/dev/oss".
# The regular format handles all cases correctly without duplication.

# ── Git branch & status ───────────────────────────────────────────────────────
# REWRITTEN to use built-in Rust modules for performance (10-100x faster than shell)
# Trade-off: Lost repo size display, gained instant prompt rendering
#
# Built-in modules provide:
# - Rust implementation (no shell subprocess overhead)
# - Automatic caching
# - Conditional styling via style expressions
#
# LIMITATION: Cannot achieve exact green/yellow conditional backgrounds with built-in modules
# Starship's style expressions don't support conditional backgrounds based on git dirty state
# Workaround: Use git_status symbol colors to indicate dirty (red/yellow symbols)
# See: https://github.com/starship/starship/issues/7556

[git_branch]
disabled = false
# Show branch with green background, NO trailing arrow (git_size or git_status will handle transitions)
format = "[\uE0B0](fg:blue bg:green)[ \uf126 $branch](bg:green fg:black)"
style = "bg:green fg:black"
symbol = ""
truncation_length = 32
truncation_symbol = "…"

[git_status]
disabled = false
# ONLY shown when there are actual status changes
# Wrapping the entire format in (...) makes it conditional on having content
format = "([\uE0B0](fg:green bg:yellow)[$all_status$ahead_behind ](bg:yellow fg:black)[\uE0B0](fg:yellow))"
style = "bg:yellow fg:black"
# Status symbols (dirty indicators)
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
stashed = "*${count}"
deleted = "✘${count}"
renamed = "»${count}"
# Ahead/behind symbols
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇣${ahead_count}⇡${behind_count}"
conflicted = "=${count}"

# ── Custom: Git repository size ──────────────────────────────────────────────
# Shows the size of the .git directory (via 'git size' alias which runs du)
# Performance: Shell command adds ~50ms delay per prompt render
#
# Visual integration:
# Placed after git_branch on green background, before git_status/git_clean_arrow
# Format includes trailing space on green background for smooth transition to next segment:
#   - When clean: space is used by git_clean_arrow (just the arrow, no added space)
#   - When dirty/ahead/behind: space is used by git_status (arrow starts immediately)
[custom.git_size]
command = "GIT_SIZE_QUIET=1 git size"
require_repo = true
when = "true"  # Always show in git repos
shell = ["sh", "--noprofile", "--norc"]
format = "[ $output ](bg:green fg:black)"
ignore_timeout = true

# ── Custom: Clean repo arrow ──────────────────────────────────────────────────
# Shows green arrow when repo is completely clean (no git_status output at all)
# Only renders when BOTH conditions are true:
#   1. No uncommitted changes (working tree clean via git is-dirty)
#   2. Not ahead/behind tracking branch (via git rev-list --left-right --count)
#      OR no tracking branch (git rev-parse @{u} fails)
#
# Performance: Three shell commands when condition is evaluated:
#   - git is-dirty: ~50-100ms (short-circuits if dirty - most common case)
#   - git rev-parse @{u}: ~20-30ms (checks for upstream, short-circuits if none)
#   - git rev-list --left-right --count: ~30-50ms (only when clean + has upstream)
#   Total worst case: ~100-180ms (clean repo with upstream)
#
# Format: Just the arrow character (no leading space) - uses trailing space from git_size
[custom.git_clean_arrow]
command = "echo ''"  # No-op, just need the format
require_repo = true
when = """! git is-dirty && \
(! git rev-parse --abbrev-ref @{u} >/dev/null 2>&1 || \
 test "$(git rev-list --left-right --count @{u}...HEAD 2>/dev/null | awk '{print $1+$2}')" = "0")"""
shell = ["sh", "--noprofile", "--norc"]
format = "[\uE0B0](fg:green)"
ignore_timeout = true

# ── Custom: iTerm2 shell integration marks A and B ──────────────────────────
# Mark A (prompt start) and mark B (prompt end) output by starship.
# Newline output in precmd hook (runs before starship renders).
# Marks C/D (command start/end) output in preexec/precmd hooks in .zshrc.
#
# The complete set of 4 marks enables full iTerm2 features:
#   - Command output selection (⌘⇧A)
#   - Mark navigation/cycling (⌘↑ / ⌘↓ with wraparound)
#   - Shell integration features without iTerm2's auto-detection
#
# Helper functions (iterm2_mark_*) are defined in .shellrc.
# Conditional on ITERM_SESSION_ID (only in iTerm2) and PROMPT_INITIALIZED (after .zshrc loads).
[custom.iterm2_start]
command = 'iterm2_mark_prompt_start'
when = 'test -n "${ITERM_SESSION_ID:-}" && test -n "${PROMPT_INITIALIZED:-}"'
shell = ["zsh", "-c"]
format = "$output"

[custom.iterm2_end]
command = 'iterm2_mark_prompt_end'
when = 'test -n "${ITERM_SESSION_ID:-}" && test -n "${PROMPT_INITIALIZED:-}"'
shell = ["zsh", "-c"]
format = "$output"
description = "iTerm2 prompt end mark (after visible prompt content)"

# ── Exit status ───────────────────────────────────────────────────────────────
# ✔ in bold green on zero exit; ✘ in bold red on non-zero exit.
# success_symbol embeds its own color tag so it overrides the module-level style.
[status]
disabled = false
format = "[$symbol]($style) "
style = "bold red"
success_symbol = "[✔](bold green)"
symbol = "✘"
not_executable_symbol = "✘"
not_found_symbol = "✘"
sigint_symbol = "✘"
signal_symbol = "✘"
map_symbol = true

# ── Command duration ──────────────────────────────────────────────────────────
# Only shown when the last command took ≥ 3 seconds.
# Separator \uE0B2 is embedded so the arrow only appears when this segment is visible.
# \uE0B3 is the thin right-arrow used as a sub-separator after the duration text.
[cmd_duration]
min_time = 3_000
format = "[\uE0B2](fg:cyan bg:black)[ took $duration ](fg:black bg:cyan)[\uE0B3](fg:black bg:cyan)"
show_milliseconds = false

# ── Background jobs ───────────────────────────────────────────────────────────
# Shows ⚙ when there is at least one background job.
[jobs]
format = "[$symbol](fg:color_jobs_fg) "
symbol = "⚙"
number_threshold = 1
symbol_threshold = 1

# ── Direnv ────────────────────────────────────────────────────────────────────
# Disabled: ~/.envrc exists so DIRENV_DIR is always set, making the segment
# permanently visible which is not useful.
[env_var.DIRENV_DIR]
disabled = true

# ── Username/hostname (context) ───────────────────────────────────────────────
# Only shown when in an SSH session or running as root (show_always = false).
# (hidden by default).
[username]
format = "[$user](fg:color_ctx_fg)"
style_user = "fg:color_ctx_fg"
style_root = "fg:red bold"
show_always = false

[hostname]
format = "[@$hostname ](fg:color_ctx_fg)"
style = "fg:color_ctx_fg"
ssh_only = true

# ── Time ──────────────────────────────────────────────────────────────────────
# 12-hour clock, format "%I:%M:%S %p" (e.g. 11:30:00 AM).
# White background, black text. Always shown on the right prompt.
[time]
disabled = false
format = "[ $time ](fg:black bg:white)"
time_format = "%I:%M:%S %p"
use_12hr = true

# ── Prompt character ──────────────────────────────────────────────────────────
# ❯ in green on success, red on error. ❮ in vi command mode.
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# ── Custom: git segments DISABLED ────────────────────────────────────────────
# REPLACED with built-in [git_branch] and [git_status] modules (see above)
# Reason: Custom shell commands (git st-nolock, git is-dirty, git rev-parse, etc.)
# caused 2-4 second delay to first keystroke after prompt appeared.
# Built-in modules use Rust implementation with caching - 10-100x faster.
#
# Trade-off: Lost conditional green/yellow backgrounds based on repo state.
# Added back repo size display via separate [custom.git_size] segment (~50ms overhead).
# Added back clean arrow via [custom.git_clean_arrow] segment (~50-180ms overhead).
#
# Original custom segments preserved below for reference (all disabled):

[custom.git_info_clean]
disabled = true
command = """
# st-nolock already called by 'when' condition - don't call it again!
branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
branch=$(printf '%.32s' "$branch")
[ ${#branch} -eq 32 ] && branch="${branch}…"
# Ahead/behind check
counts=$(git rev-list --left-right --count @{u}...HEAD 2>/dev/null || echo "0	0")
behind=$(echo "$counts" | cut -f1)
ahead=$(echo "$counts" | cut -f2)
status_str=""
[ "$ahead" -gt 0 ] && [ "$behind" -gt 0 ] && status_str=" ⇣${behind}⇡${ahead}"
[ "$ahead" -gt 0 ] && [ "$behind" -eq 0 ] && status_str=" ⇡${ahead}"
[ "$behind" -gt 0 ] && [ "$ahead" -eq 0 ] && status_str=" ⇣${behind}"
# Repo size REMOVED to reduce prompt render time
printf ' \uf126 %s%s ' "$branch" "$status_str"
"""
require_repo = true
when = "! git is-dirty"
shell = ["sh", "--noprofile", "--norc"]
format = "[\uE0B0](fg:blue bg:green)[$output](bg:green fg:black)[\uE0B0](fg:green)"
ignore_timeout = true

# Dirty state: shown when `git status --porcelain` produces any output
[custom.git_info_dirty]
disabled = true
command = """
# st-nolock already called by 'when' condition - don't call it again!
# BUT we need porcelain output for detailed status, so we must call it here too.
# TODO: Find a way to cache the porcelain output from 'when' check.
porcelain=$(git st-nolock)
branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
branch=$(printf '%.32s' "$branch")
[ ${#branch} -eq 32 ] && branch="${branch}…"
# Parse porcelain for detailed status
counts=$(printf '%s\n' "$porcelain" | awk '
  /^[MADRC]/ { staged++ }
  /^.M| M/ { modified++ }
  /^[?][?]/ untracked++ }
  END { print staged+0, modified+0, untracked+0 }
')
staged=$(echo "$counts" | cut -d' ' -f1)
modified=$(echo "$counts" | cut -d' ' -f2)
untracked=$(echo "$counts" | cut -d' ' -f3)
stashed=$(git stash list 2>/dev/null | /usr/bin/grep -c . || true)
# Ahead/behind check
counts=$(git rev-list --left-right --count @{u}...HEAD 2>/dev/null || echo "0	0")
behind=$(echo "$counts" | cut -f1)
ahead=$(echo "$counts" | cut -f2)
status_str=""
[ "$staged" -gt 0 ] && status_str="${status_str}+${staged}"
[ "$modified" -gt 0 ] && status_str="${status_str}!${modified}"
[ "$untracked" -gt 0 ] && status_str="${status_str}?${untracked}"
[ "$stashed" -gt 0 ] && status_str="${status_str}*${stashed}"
[ "$ahead" -gt 0 ] && [ "$behind" -gt 0 ] && status_str="${status_str}⇣${behind}⇡${ahead}"
[ "$ahead" -gt 0 ] && [ "$behind" -eq 0 ] && status_str="${status_str}⇡${ahead}"
[ "$behind" -gt 0 ] && [ "$ahead" -eq 0 ] && status_str="${status_str}⇣${behind}"
# Repo size REMOVED to reduce prompt render time
if [ -n "$status_str" ]; then
  printf ' \uf126 %s %s ' "$branch" "$status_str"
else
  printf ' \uf126 %s ' "$branch"
fi
"""
require_repo = true
when = "git is-dirty"
shell = ["sh", "--noprofile", "--norc"]
format = "[\uE0B0](fg:blue bg:yellow)[$output](bg:yellow fg:black)[\uE0B0](fg:yellow)"
ignore_timeout = true

# ── Git operation state (built-in module) ────────────────────────────────────
# Shown in bold red when a multi-step git operation is in progress:
# rebase, merge, cherry-pick, revert, or bisect.
# Uses Starship's built-in git_state module (replaced custom segment that manually
# checked git refs - built-in uses same logic internally but with better caching).
[git_state]
format = "[$state( $progress_current/$progress_total)]($style)"
style = "bold red"
rebase = ">> REBASING <<"
merge = ">> MERGING <<"
cherry_pick = ">> CHERRY-PICKING <<"
revert = ">> REVERTING <<"
bisect = ">> BISECTING <<"

# ── Disabled modules ─────────────────────────────────────────────────────────
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[terraform]
disabled = true
[kubernetes]
disabled = true
[python]
disabled = true
[nodejs]
disabled = true
[ruby]
disabled = true
[golang]
disabled = true
[rust]
disabled = true
[java]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true

# ── Enabled lightweight modules ──────────────────────────────────────────────
# mise: shown only when a project has an active mise runtime (auto-detected by
# .mise.toml, .tool-versions, etc.). Quiet by default - only renders when used.
[mise]
disabled = false
format = "[ ⇪ $health ]($style)"
style = "fg:cyan"

# direnv: shown when an .envrc is loaded for the current directory. Useful as
# a visual confirmation that direnv has applied its env vars.
[direnv]
disabled = false
format = "[ direnv $loaded$allowed]($style) "
style = "fg:yellow"
symbol = "📁 "
allowed_msg = ""
not_allowed_msg = "[!]"
denied_msg = "[✗]"
loaded_msg = ""
unloaded_msg = "[?]"
