# RuboCop global configuration (applies to all Ruby projects)
# Project-specific overrides should be in .rubocop.yml in each project root
#
# Usage:
#   rubocop                          # Check all Ruby files
#   rubocop -a                       # Auto-fix safe issues
#   rubocop scripts/my-script.rb     # Check specific file

AllCops:
  # TargetRubyVersion should be set in project-specific .rubocop.yml
  # This global config targets the oldest commonly-supported Ruby version
  # Projects can override with their actual version (e.g., 3.3, 3.2, etc.)
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

# Layout and Style
Layout/LineLength:
  Max: 170
  # Scripts use descriptive variable names and inline comments

Style/StringLiterals:
  EnforcedStyle: single_quotes
  # Prefer single quotes unless interpolation needed

Style/FrozenStringLiteralComment:
  Enabled: true
  # Enforce frozen_string_literal: true for performance

Style/Documentation:
  Enabled: false
  # Scripts are self-documenting with inline comments

# Metrics (disabled - small utility scripts don't benefit from strict limits)
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
  # Option parsing blocks are legitimately long

# Lint (catch actual bugs)
Lint/UnusedBlockArgument:
  Enabled: true
Lint/UnusedMethodArgument:
  Enabled: true
Lint/UselessAssignment:
  Enabled: true
Lint/Debugger:
  Enabled: true
Lint/ShadowingOuterLocalVariable:
  Enabled: true
